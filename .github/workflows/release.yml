name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run check
      - name: Verify release tag matches workspace package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./packages/cli/package.json').version")"
          test "$(node -p "require('./packages/client/package.json').version")" = "$(node -p "require('./packages/cli/package.json').version")"
          test "$(node -p "require('./packages/mcp/package.json').version")" = "$(node -p "require('./packages/cli/package.json').version")"
      - name: Publish client
        run: npm publish --workspace @navop/client --access public --provenance
      - name: Publish CLI
        run: npm publish --workspace @navop/cli --access public --provenance
      - name: Publish MCP bridge
        run: npm publish --workspace @navop/mcp --access public --provenance
