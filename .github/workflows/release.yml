name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v0.2.0

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run check
      - name: Verify release tag matches workspace package versions
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./packages/cli/package.json').version")"
          test "$(node -p "require('./packages/client/package.json').version")" = "$(node -p "require('./packages/cli/package.json').version")"
          test "$(node -p "require('./packages/mcp/package.json').version")" = "$(node -p "require('./packages/cli/package.json').version")"
      - name: Publish client
        run: |
          version="$(node -p "require('./packages/client/package.json').version")"
          if npm view "@navop/client@$version" version >/dev/null 2>&1; then
            echo "@navop/client@$version already exists; skipping"
          else
            npm publish --workspace @navop/client --access public --provenance
          fi
      - name: Publish CLI
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if npm view "@navop/cli@$version" version >/dev/null 2>&1; then
            echo "@navop/cli@$version already exists; skipping"
          else
            npm publish --workspace @navop/cli --access public --provenance
          fi
      - name: Publish MCP bridge
        run: |
          version="$(node -p "require('./packages/mcp/package.json').version")"
          if npm view "@navop/mcp@$version" version >/dev/null 2>&1; then
            echo "@navop/mcp@$version already exists; skipping"
          else
            npm publish --workspace @navop/mcp --access public --provenance
          fi
